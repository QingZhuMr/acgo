{extend name="layout" /}

{block name="title"}管理员管理{/block}

{block name="style"}
<style>
    .search-bar { position: relative; z-index: 20; background: var(--bg); border: none; border-radius: 0; padding: 15px; margin-bottom: 15px; box-shadow: none; }
    .search-bar .layui-form-item { margin-bottom: 0; }
</style>
{/block}

{block name="content"}
<div class="search-bar">
    <form class="layui-form" lay-filter="searchForm">
        <div class="layui-inline">
            <input type="text" name="keyword" placeholder="账号/昵称" autocomplete="off" class="layui-input">
        </div>
        <div class="layui-inline">
            <select name="level" title="等级筛选">
                <option value="">全部等级</option>
                <option value="1">普通管理员</option>
                <option value="2">管理员</option>
                <option value="9">超级管理员</option>
            </select>
        </div>
        <div class="layui-inline">
            <select name="status" title="状态筛选">
                <option value="">全部状态</option>
                <option value="1">正常</option>
                <option value="0">禁用</option>
            </select>
        </div>
        <div class="layui-inline">
            <button type="button" class="layui-btn search-btn" lay-submit lay-filter="search" title="搜索"><i class="fas fa-search"></i></button>
        </div>
    </form>
</div>

<div class="page-content">
    <table id="adminTable" lay-filter="adminTable"></table>
</div>

<!-- 表格工具栏：新增管理员 + 默认筛选/打印/导出 -->
<script type="text/html" id="adminToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm page-btn" id="btnAdd">新增管理员</button>
    </div>
</script>

<!-- 操作列模板 -->
<script type="text/html" id="barTpl">
    <button type="button" class="layui-btn layui-btn-xs op-btn" lay-event="ops" data-id="{{ d.id }}"><i class="fas fa-wrench"></i></button>
</script>

<!-- 状态列模板 -->
<script type="text/html" id="statusTpl">
    {{# if(d.status == 1){ }}
        <span class="layui-badge layui-bg-green">{{ d.status_text }}</span>
    {{# } else { }}
        <span class="layui-badge layui-bg-gray">{{ d.status_text }}</span>
    {{# } }}
</script>

<!-- 等级列模板 -->
<script type="text/html" id="levelTpl">
    {{# if(d.level == 9){ }}
        <span class="layui-badge layui-bg-red">{{ d.level_name }}</span>
    {{# } else if(d.level == 2){ }}
        <span class="layui-badge layui-bg-blue">{{ d.level_name }}</span>
    {{# } else { }}
        <span class="layui-badge layui-bg-cyan">{{ d.level_name }}</span>
    {{# } }}
</script>
{/block}

{block name="script"}
<script>
layui.use(['table', 'form', 'layer'], function () {
    var table  = layui.table;
    var form   = layui.form;
    var layer  = layui.layer;
    var $      = layui.$;

    // 排序状态（点击表头切换，默认按 id 正序）
    var sortParam = { field: 'id', order: 'asc' };
    var searchWhere = {};
    function mergeQuery() {
        var q = {};
        Object.keys(searchWhere).forEach(function (k) { q[k] = searchWhere[k]; });
        q.field = sortParam.field;
        q.order = sortParam.order;
        return q;
    }

    var adminTable = table.render({
        elem: '#adminTable',
        url: '/admin/getList',
        method: 'get',
        page: true,
        limit: 20,
        limits: [10, 20, 50, 100],
        toolbar: '#adminToolbar',
        defaultToolbar: ['filter', 'print', 'exports'],
        autoSort: false,
        initSort: { field: 'id', type: 'asc' },
        cols: [[
            { field: 'id', title: 'ID', width: 60, align: 'center', sort: true },
            { field: 'username', title: '账号', minWidth: 120, sort: true },
            { field: 'nickname', title: '昵称', minWidth: 140, sort: true },
            { field: 'level', title: '权限等级', width: 120, align: 'center', templet: '#levelTpl', sort: true },
            { field: 'status', title: '状态', width: 90, align: 'center', templet: '#statusTpl', sort: true },
            { field: 'last_login_time', title: '最后登录时间', minWidth: 170, sort: true },
            { field: 'last_login_ip', title: '最后登录IP', minWidth: 130 },
            { field: 'create_time', title: '创建时间', minWidth: 170, sort: true },
            { title: '操作', width: 90, align: 'center', toolbar: '#barTpl', fixed: 'right' }
        ]],
        skin: 'line',
        even: true,
        text: { none: '暂无数据' }
    });

    form.on('submit(search)', function (data) {
        searchWhere = data.field || {};
        adminTable.reload({ where: mergeQuery(), page: { curr: 1 } });
        return false;
    });

    // 表头排序：提交 field/order 给后端
    table.on('sort(adminTable)', function (obj) {
        sortParam.field = obj.field || 'id';
        sortParam.order = obj.type || 'asc';
        adminTable.reload({
            initSort: obj,
            where: mergeQuery(),
            page: { curr: 1 }
        });
    });

    // 工具栏：打印 / 导出（自定义导出，输出纯文本值）
    table.on('toolbar(adminTable)', function (obj) {
        if (obj.event === 'LAY_TABLE_EXPORT' || obj.event === 'exports') {
            var exportData = [];
            table.getData('adminTable', true).forEach(function (r) {
                exportData.push({
                    'ID': r.id,
                    '账号': r.username,
                    '昵称': r.nickname,
                    '权限等级': r.level_name,
                    '状态': r.status_text,
                    '最后登录时间': r.last_login_time,
                    '最后登录IP': r.last_login_ip,
                    '创建时间': r.create_time
                });
            });
            table.exportFile('adminTable', exportData, 'xlsx');
            return false; // 阻止默认导出
        }
    });

    $('#btnAdd').on('click', function () { openForm('add'); });

    // 操作列：点击省略按钮 → 用 Layui 原生 layer 弹窗展示操作菜单
    table.on('tool(adminTable)', function (obj) {
        var data = obj.data;
        if (obj.event === 'ops') {
            var btns = '';
            btns += '<button type="button" class="op-act-btn" data-ev="edit"><i class="fas fa-edit"></i> 编辑</button>';
            btns += '<button type="button" class="op-act-btn" data-ev="resetpwd"><i class="fas fa-key"></i> 重置密码</button>';
            btns += '<button type="button" class="op-act-btn danger" data-ev="del"><i class="fas fa-trash"></i> 删除</button>';
            // 操作对象提示（管理员优先昵称，无则用户名）
            var targetName = data.nickname || data.username;
            var html = '<div class="op-layer-target"><i class="fas fa-user-shield"></i> 操作对象：<b>' + targetName + '</b></div>' +
                       '<div class="op-layer-body">' + btns + '</div>';
            var opsLayer = layer.open({
                type: 1,
                title: '操作',
                area: ['280px', 'auto'],
                content: html,
                closeBtn: 1,
                shade: 0.3,
                shadeClose: true
            });
            $('.op-layer-body button').off('click').on('click', function () {
                var ev = $(this).attr('data-ev');
                layer.close(opsLayer);
                if (ev === 'edit') openForm('edit', data);
                else if (ev === 'resetpwd') resetPwd(data);
                else if (ev === 'del') delAdmin(data);
            });
        }
    });

    function openForm(type, data) {
        var isEdit = type === 'edit';
        // 编辑时顶部显示操作对象提示（管理员优先昵称，无则用户名）
        var target = isEdit ? '<div class="op-layer-target"><i class="fas fa-user-shield"></i> 操作对象：<b>' + (data.nickname || data.username) + '</b></div>' : '';
        layer.open({
            type: 1,
            title: isEdit ? '编辑管理员' : '新增管理员',
            area: ['100%', 'auto'],
            content: target + formHtml(isEdit, data),
            success: function (layero) {
                form.render();
                if (isEdit) {
                    $('#frmUsername').val(data.username).prop('disabled', true);
                    $('#frmNickname').val(data.nickname);
                    $('#frmLevel').val(data.level);
                    $('#frmStatus').val(data.status);
                    form.render('select');
                }
            }
        });
    }

    function formHtml(isEdit, data) {
        return '' +
        '<form class="layui-form" id="adminForm" style="padding:20px 25px 5px;">' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">账号</label>' +
                '<div class="layui-input-block"><input type="text" id="frmUsername" name="username" placeholder="登录账号" autocomplete="off" class="layui-input"></div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">昵称</label>' +
                '<div class="layui-input-block"><input type="text" id="frmNickname" name="nickname" placeholder="昵称" autocomplete="off" class="layui-input"></div>' +
            '</div>' +
            (isEdit ? '' :
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">密码</label>' +
                '<div class="layui-input-block"><input type="password" id="frmPassword" name="password" placeholder="初始密码(至少6位)" autocomplete="off" class="layui-input"></div>' +
            '</div>') +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">权限等级</label>' +
                '<div class="layui-input-block"><select id="frmLevel" name="level">' +
                    '<option value="1">普通管理员</option><option value="2">管理员</option><option value="9">超级管理员</option>' +
                '</select></div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">状态</label>' +
                '<div class="layui-input-block"><select id="frmStatus" name="status">' +
                    '<option value="1">正常</option><option value="0">禁用</option>' +
                '</select></div>' +
            '</div>' +
            '<div class="layui-form-item" style="text-align:right;padding-right:25px;">' +
                '<button class="layui-btn" lay-submit lay-filter="submitAdmin">确定</button>' +
                '<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>' +
            '</div>' +
        '</form>';
    }

    form.on('submit(submitAdmin)', function (data) {
        var formData = data.field;
        var isEdit = !!$('#frmUsername').prop('disabled');
        $.post(isEdit ? '/admin/edit' : '/admin/add', formData, function (res) {
            if (res.code === 0) { layer.closeAll(); layer.msg(res.msg, { icon: 1 }); adminTable.reload(); }
            else { layer.msg(res.msg, { icon: 2 }); }
        }, 'json');
        return false;
    });

    $(document).on('click', '#btnCancel', function () { layer.closeAll(); });

    function delAdmin(data) {
        var name = data.nickname || data.username;
        layer.confirm('确定删除管理员【' + name + '】吗？', { icon: 3, title: '提示' }, function (index) {
            $.post('/admin/delete', { id: data.id }, function (res) {
                if (res.code === 0) { layer.msg(res.msg, { icon: 1 }); adminTable.reload(); }
                else { layer.msg(res.msg, { icon: 2 }); }
            }, 'json');
            layer.close(index);
        });
    }

    function resetPwd(data) {
        var name = data.nickname || data.username;
        layer.prompt({
            title: '为 【' + name + '】 设置新密码（至少6位）',
            formType: 1, maxlength: 30
        }, function (val, index) {
            if (val.length < 6) { layer.msg('密码长度至少6位', { icon: 2 }); return; }
            $.post('/admin/resetPassword', { id: data.id, password: val }, function (res) {
                if (res.code === 0) { layer.msg(res.msg, { icon: 1 }); layer.close(index); }
                else { layer.msg(res.msg, { icon: 2 }); }
            }, 'json');
        });
    }
});
</script>
{/block}
