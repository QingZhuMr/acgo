{extend name="layout" /}

{block name="title"}{$app_name} - 管理面板{/block}

{block name="style"}
<style>
    /* 登录页：覆盖公共 body，全屏居中 */
    body {
        height: 100vh;
        padding: 0 !important;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Microsoft YaHei", sans-serif;
        position: relative;
        overflow: hidden;
        /* 背景：白天彩色渐变，黑夜深色渐变 */
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        transition: background .25s ease;
    }
    /* 黑夜模式登录背景 */
    [data-theme="dark"] body {
        background: linear-gradient(135deg, #1c1c1e 0%, #2a2a2e 45%, #3a3a3c 100%);
    }
    /* 背景装饰光斑（黑夜降低可见度） */
    body::before,
    body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.6;
    }
    [data-theme="dark"] body::before,
    [data-theme="dark"] body::after { opacity: 0.15; }
    body::before {
        width: 400px; height: 400px;
        top: -100px; left: -100px;
        background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 70%);
    }
    body::after {
        width: 500px; height: 500px;
        bottom: -150px; right: -100px;
        background: radial-gradient(circle, rgba(255,255,255,0.25), transparent 70%);
    }
    /* 玻璃卡片 */
    .login-box {
        width: 400px;
        background: rgba(255, 255, 255, 0.18);
        -webkit-backdrop-filter: saturate(180%) blur(30px);
        backdrop-filter: saturate(180%) blur(30px);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        padding: 40px 40px 30px;
        position: relative;
        z-index: 10;
    }
    /* 黑夜模式玻璃卡片：更透明深色 */
    [data-theme="dark"] .login-box {
        background: rgba(28, 28, 30, 0.72);
        border-color: rgba(255,255,255,0.14);
    }
    .login-box .logo {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-box .logo h1 {
        font-size: 22px;
        color: #fff;
        font-weight: 700;
        text-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .login-box .logo p {
        color: rgba(255,255,255,0.8);
        font-size: 13px;
        margin-top: 4px;
    }
    .layui-form-item { margin-bottom: 20px; }
    /* 输入框（毛玻璃） */
    .login-box .layui-input {
        height: 48px;
        border-radius: 12px;
        padding-left: 44px;
        background: rgba(255,255,255,0.22);
        border: 1px solid rgba(255,255,255,0.35);
        color: #fff;
        transition: all .25s ease;
    }
    .login-box .layui-input::placeholder { color: rgba(255,255,255,0.65); }
    .login-box .layui-input:focus {
        background: rgba(255,255,255,0.3);
        border-color: rgba(255,255,255,0.6);
        box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
    }
    /* 黑夜模式输入框 */
    [data-theme="dark"] .login-box .layui-input {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.18);
    }
    [data-theme="dark"] .login-box .layui-input:focus {
        background: rgba(255,255,255,0.12);
        border-color: var(--primary);
    }
    .login-box .icon-wrap { position: relative; }
    .login-box .icon-wrap > i {
        position: absolute;
        left: 16px; top: 16px;
        color: rgba(255,255,255,0.7);
        font-size: 16px;
        z-index: 1;
    }
    /* 登录按钮 */
    .btn-login {
        width: 100%;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0.2));
        border: 1px solid rgba(255,255,255,0.4);
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 4px;
        cursor: pointer;
        transition: all .3s ease;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .btn-login:hover {
        background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.3));
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(0,0,0,0.2);
    }
    .btn-login:active { transform: translateY(0); }
    /* 黑夜模式登录按钮：主题蓝 */
    [data-theme="dark"] .btn-login {
        background: var(--primary);
        border-color: var(--primary);
    }
    [data-theme="dark"] .btn-login:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .footer {
        text-align: center;
        color: rgba(255,255,255,0.75);
        font-size: 12px;
        margin-top: 20px;
    }
</style>
{/block}

{block name="content"}
<div class="login-box">
    <div class="logo">
        <h1>{$app_name}管理面板</h1>
        <p>Management System</p>
    </div>
    <form class="layui-form" id="loginForm" onsubmit="return false;">
        <div class="layui-form-item">
            <div class="icon-wrap">
                <i class="fas fa-user"></i>
                <input type="text" name="username" id="username" placeholder="请输入账号" autocomplete="off"
                       class="layui-input" value="">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="icon-wrap">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" id="password" placeholder="请输入密码" autocomplete="off"
                       class="layui-input" value="">
            </div>
        </div>
        <div class="layui-form-item" style="margin-bottom: 10px;">
            <button type="button" class="btn-login" id="btnLogin" lay-submit lay-filter="login">登 录</button>
        </div>
    </form>
    <div class="footer">© 2026 {$app_name} · 仅限授权人员登录</div>
</div>
{/block}

{block name="script"}
<script>
    // 主题初始化：本地有偏好则应用；没有则写入默认"白天"模式
    (function () {
        if (!ACGOTheme.getPreference()) {
            ACGOTheme.setPreference('light');
        } else {
            ACGOTheme.apply();
        }
    })();
</script>
<script>
    layui.use(['layer', 'form'], function () {
        var layer = layui.layer;
        var form  = layui.form;

        // 异地登录被挤下线提示
        var kick = new URLSearchParams(window.location.search).get('kick');
        if (kick == '1') {
            layer.alert('您的账号已在其他设备登录，您已被强制下线！', {
                icon: 2,
                title: '异地登录提示',
                closeBtn: 0
            });
        }

        // 监听登录提交
        form.on('submit(login)', function (data) {
            $('#btnLogin').prop('disabled', true).text('登录中...');
            $.post('/login/doLogin', data.field, function (res) {
                $('#btnLogin').prop('disabled', false).text('登 录');
                if (res.code === 0) {
                    layer.msg('登录成功', { icon: 1 }, function () {
                        window.location.href = res.url;
                    });
                } else {
                    layer.msg(res.msg || '登录失败', { icon: 2 });
                }
            }, 'json').fail(function () {
                $('#btnLogin').prop('disabled', false).text('登 录');
                layer.msg('网络异常，请稍后重试', { icon: 2 });
            });
            return false;
        });
    });
</script>
{/block}
