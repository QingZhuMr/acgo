{extend name="layout" /}

{block name="title"}通知管理{/block}

{block name="style"}
<style>
    .acgo-uid { color: #1E9FFF; cursor: pointer; }
</style>
{/block}

{block name="content"}
<div class="layui-fluid">
    <form class="layui-form layui-form-pane" lay-filter="searchForm" style="margin-top:12px;">
        <div class="layui-form-item acgo-search-row">
            <div class="layui-inline"><label class="layui-form-label">收件用户ID</label><div class="layui-input-inline"><input type="text" name="uid" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">发送者ID</label><div class="layui-input-inline"><input type="text" name="from_uid" class="layui-input"></div></div>
            <div class="layui-inline"><label class="layui-form-label">类型</label><div class="layui-input-inline"><select name="type"><option value="">全部</option><option value="1">评论帖子</option><option value="2">回复评论</option></select></div></div>
            <div class="layui-inline"><label class="layui-form-label">已读</label><div class="layui-input-inline"><select name="is_read"><option value="">全部</option><option value="0">未读</option><option value="1">已读</option></select></div></div>
            <div class="layui-inline"><button class="layui-btn" lay-submit lay-filter="searchBtn">搜索</button><button type="reset" class="layui-btn layui-btn-primary">重置</button></div>
            <div class="layui-inline"><button type="button" class="layui-btn layui-btn-normal" id="btnReadAll">按用户全部已读</button></div>
        </div>
    </form>
    <table id="noticeTable" lay-filter="noticeTable"></table>
</div>
{/block}

{block name="script"}
<script>
layui.use(['table', 'form', 'layer'], function () {
    var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;

    var TYPE_TEXT = {1: '<span class="layui-badge layui-bg-blue">评论帖子</span>', 2: '<span class="layui-badge layui-bg-orange">回复评论</span>'};
    var READ_TEXT = {0: '<span class="layui-badge layui-bg-gray">未读</span>', 1: '<span class="layui-badge layui-bg-green">已读</span>'};

    function fmtTime(t) { if (!t) return ''; var d = new Date(parseInt(t) * 1000); var p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
    function txt(s) { s = s || ''; return s.length > 40 ? s.substring(0, 40) + '…' : s; }
    function nick(v) { return v ? v : '<span style="color:#bbb">系统/平台</span>'; }

    function reload() { table.reload('noticeTable'); }

    function opAction(url, id, okText) {
        layer.prompt({title: okText + '（请输入管理员密码）', formType: 1}, function (pass, index) {
            layer.close(index);
            $.ajax({ url: url, type: 'POST', data: {id: id, admin_password: pass}, success: function (r) {
                if (r.code === 0) { layer.msg(r.msg || '操作成功', {icon: 1}); reload(); }
                else { layer.msg(r.msg || '操作失败', {icon: 2}); }
            }, error: function () { layer.msg('请求失败', {icon: 2}); } });
        });
    }

    table.render({
        elem: '#noticeTable', url: '/notification/getList', page: true, limits: [15, 30, 50], limit: 15,
        cols: [[
            {field: 'id', title: 'ID', width: 70},
            {field: 'user_nickname', title: '收件用户', width: 130, templet: function (d) { return '<a href="javascript:;" class="acgo-uid" data-uid="' + d.user_id + '">' + nick(d.user_nickname) + '</a>'; }},
            {field: 'from_nickname', title: '发送者', width: 130, templet: function (d) { return nick(d.from_nickname); }},
            {field: 'type', title: '类型', width: 110, templet: function (d) { return TYPE_TEXT[d.type] || d.type; }},
            {field: 'content', title: '内容', minWidth: 240, templet: function (d) {
                var c = d.type == 1 ? d.post_content : d.comment_content;
                var pid = d.type == 1 ? d.post_id : d.comment_id;
                return '<span title="' + (c || '').replace(/"/g, '') + '">#' + pid + ' ' + txt(c) + '</span>';
            }},
            {field: 'is_read', title: '状态', width: 90, templet: function (d) { return READ_TEXT[d.is_read] || d.is_read; }},
            {field: 'create_time', title: '创建时间', width: 170, templet: function (d) { return fmtTime(d.create_time); }},
            {title: '操作', width: 150, fixed: 'right', templet: function (d) {
                var h = '';
                if (d.is_read == 0) h += '<a class="layui-btn layui-btn-xs" lay-event="read">标记已读</a>';
                h += '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
                return h;
            }}
        ]],
        response: {statusCode: 0}, parseData: function (r) { return {code: r.code, msg: r.msg, count: r.count, data: r.data}; }
    });

    form.on('submit(searchBtn)', function (d) { table.reload('noticeTable', {where: d.field, page: {curr: 1}}); return false; });

    table.on('tool(noticeTable)', function (obj) {
        if (obj.event === 'read') opAction('/notification/read', obj.data.id, '标记已读');
        if (obj.event === 'del') opAction('/notification/del', obj.data.id, '删除通知');
    });

    $(document).on('click', '#btnReadAll', function () {
        layer.prompt({title: '输入用户ID（将该用户全部通知标为已读）', formType: 0}, function (uid, i1) {
            layer.prompt({title: '请输入管理员密码', formType: 1}, function (pass, i2) {
                layer.close(i1); layer.close(i2);
                $.ajax({ url: '/notification/readAll', type: 'POST', data: {uid: uid, admin_password: pass}, success: function (r) {
                    if (r.code === 0) { layer.msg(r.msg || '操作成功', {icon: 1}); reload(); }
                    else { layer.msg(r.msg || '操作失败', {icon: 2}); }
                }, error: function () { layer.msg('请求失败', {icon: 2}); } });
            });
        });
    });
});
</script>
{/block}
