{extend name="layout" /}

{block name="title"}管理员日志{/block}

{block name="content"}
<div class="page-search">
    <form class="layui-form" lay-filter="searchForm">
        <div class="layui-inline">
            <input type="text" name="keyword" placeholder="搜索管理员账号" autocomplete="off" class="layui-input" style="width:220px;">
        </div>
        <div class="layui-inline">
            <select name="action" title="动作筛选">
                <option value="">全部动作</option>
                <option value="login">登录</option>
                <option value="logout">登出</option>
                <option value="kick">强制下线</option>
                <option value="recharge">充值</option>
                <option value="withdraw">提现</option>
                <option value="user_create">创建用户</option>
                <option value="user_edit">编辑用户</option>
                <option value="user_ban">封禁用户</option>
                <option value="user_unban">解封用户</option>
                <option value="user_delete">注销用户</option>
                <option value="admin_create">新增管理员</option>
                <option value="admin_edit">编辑管理员</option>
                <option value="admin_delete">删除管理员</option>
                <option value="admin_reset_pwd">重置管理员密码</option>
            </select>
        </div>
        <div class="layui-inline">
            <button type="button" class="layui-btn search-btn" lay-submit lay-filter="search" title="搜索"><i class="fas fa-search"></i></button>
        </div>
    </form>
</div>
<div class="page-content">
    <table id="logTable" lay-filter="logTable"></table>
</div>

<!-- 表格工具栏：清空管理员日志 -->
<script type="text/html" id="logToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm page-btn" id="btnClearLog">清空管理员日志</button>
    </div>
</script>
{/block}

{block name="script"}
<script>
layui.use(['table', 'form', 'layer'], function () {
    var table = layui.table;
    var form  = layui.form;

    form.render();

    // 排序状态（点击表头切换，默认按 id 倒序）
    var sortParam = { field: 'id', order: 'desc' };
    var searchWhere = {};
    function mergeQuery() {
        var q = {};
        Object.keys(searchWhere).forEach(function (k) { q[k] = searchWhere[k]; });
        q.field = sortParam.field;
        q.order = sortParam.order;
        return q;
    }

    var logTable = table.render({
        elem: '#logTable',
        url: '/log/adminLogList',
        method: 'get',
        page: true,
        limit: 20,
        limits: [10, 20, 50, 100],
        toolbar: '#logToolbar',
        autoSort: false,
        initSort: { field: 'id', type: 'desc' },
        cols: [[
            { field: 'id', title: 'ID', width: 70, align: 'center', sort: true },
            { field: 'username', title: '管理员账号', minWidth: 130, sort: true },
            { field: 'action_text', title: '动作', width: 100, align: 'center',
              templet: function (d) {
                  var map = { login: 'badge-green', logout: 'badge-gray', kick: 'badge-red' };
                  return '<span class="badge ' + (map[d.action] || 'badge-blue') + '">' + d.action_text + '</span>';
              }
            },
            { field: 'login_ip', title: '登录IP', minWidth: 130, sort: true },
            { field: 'user_agent', title: '浏览器标识', minWidth: 220 },
            { field: 'create_time_text', title: '操作时间', minWidth: 160 }
        ]]
    });

    // 搜索
    form.on('submit(search)', function (data) {
        searchWhere = data.field || {};
        logTable.reload({ where: mergeQuery(), page: { curr: 1 } });
        return false;
    });

    // 表头排序：提交 field/order 给后端
    table.on('sort(logTable)', function (obj) {
        sortParam.field = obj.field || 'id';
        sortParam.order = obj.type || 'desc';
        logTable.reload({
            initSort: obj,
            where: mergeQuery(),
            page: { curr: 1 }
        });
    });

    // ===== 清空管理员日志（图形验证码） =====
    var clearUrl = '/log/clearAdminLog';
    var capLayer = null;

    // 刷新验证码图片
    function refreshCaptcha() {
        $('#capImg').attr('src', '/log/captcha?_t=' + Date.now());
        $('#capInput').val('');
    }

    // 打开验证码确认弹窗
    function openClearCaptcha() {
        var html =
            '<div style="padding:20px 24px 8px;">' +
                '<div class="layui-form-item" style="margin-bottom:12px;">' +
                    '<label style="display:block;margin-bottom:8px;color:var(--text-body);font-size:14px;">请输入图形验证码</label>' +
                    '<div style="display:flex;align-items:center;gap:10px;">' +
                        '<input type="text" id="capInput" placeholder="验证码" autocomplete="off" class="layui-input" style="flex:1;height:40px;">' +
                        '<img id="capImg" src="/log/captcha" alt="验证码" title="点击刷新" style="height:40px;border-radius:8px;cursor:pointer;border:1px solid var(--border);">' +
                    '</div>' +
                '</div>' +
            '</div>';
        capLayer = layer.open({
            type: 1,
            title: '清空管理员日志',
            content: html,
            area: ['380px', 'auto'],
            btn: ['确认清空', '取消'],
            success: function () {
                refreshCaptcha();
                $('#capImg').on('click', refreshCaptcha);
            },
            yes: function (index) {
                var code = $('#capInput').val();
                if (!code) { layer.msg('请输入验证码', { icon: 2 }); return; }
                $.post(clearUrl, { captcha: code }, function (res) {
                    if (res.code === 0) {
                        layer.close(index);
                        layer.msg(res.msg, { icon: 1 });
                        logTable.reload({ page: { curr: 1 } });
                    } else {
                        layer.msg(res.msg || '清空失败', { icon: 2 });
                        refreshCaptcha();
                    }
                }, 'json').fail(function () {
                    layer.msg('网络异常，请稍后重试', { icon: 2 });
                });
            }
        });
    }

    // 清空按钮（表格工具栏内）
    $('#btnClearLog').on('click', function () {
        layer.confirm('确认清空全部管理员日志？此操作不可恢复。', {
            icon: 3, title: '清空提示'
        }, function (index) {
            layer.close(index);
            openClearCaptcha();
        });
    });
});
</script>
{/block}
