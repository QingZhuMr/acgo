{extend name="layout" /}

{block name="title"}星球管理{/block}

{block name="style"}
<style>
    .planet-intro-preview {
        color: var(--text-body);
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .form-tip {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.5;
        margin-top: 6px;
    }
</style>
{/block}

{block name="content"}
<div class="page-search">
    <form class="layui-form" lay-filter="searchForm">
        <div class="layui-inline">
            <input type="text" name="keyword" placeholder="搜索名称/介绍" autocomplete="off" class="layui-input" style="width:200px;">
        </div>
        <div class="layui-inline">
            <select name="status" title="状态筛选">
                <option value="">全部状态</option>
                <option value="1">已启用</option>
                <option value="0">已禁用</option>
            </select>
        </div>
        <div class="layui-inline">
            <button type="button" class="layui-btn search-btn" lay-submit lay-filter="search" title="搜索"><i class="fas fa-search"></i></button>
        </div>
    </form>
</div>

<div class="page-content">
    <table id="planetTable" lay-filter="planetTable"></table>
</div>

<!-- 表格工具栏：新增/刷新 -->
<script type="text/html" id="planetToolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-sm page-btn" lay-event="add">新增星球</button>
        <button class="layui-btn layui-btn-sm page-btn" lay-event="refresh">刷新</button>
    </div>
</script>

<!-- 状态徽章 -->
<script type="text/html" id="statusTpl">
    {{# if(d.status == 1){ }}
        <span class="badge badge-green">已启用</span>
    {{# } else { }}
        <span class="badge badge-gray">已禁用</span>
    {{# } }}
</script>

<!-- 操作列：单省略按钮 -->
<script type="text/html" id="barTpl">
    <button type="button" class="layui-btn layui-btn-xs op-btn" lay-event="ops"><i class="fas fa-wrench"></i></button>
</script>
{/block}

{block name="script"}
<script>
// 星球类型选项（后端注入：key=存储值, value=显示名）
var PLANET_TYPES = {:json_encode($types, JSON_UNESCAPED_UNICODE)};
layui.use(['table', 'form', 'layer'], function () {
    var table = layui.table;
    var form  = layui.form;
    var layer = layui.layer;
    var $     = layui.$;

    // 初始化渲染表单组件
    form.render();

    var sortParam = { field: 'id', order: 'desc' };
    var searchWhere = {};
    function mergeQuery() {
        var q = {};
        Object.keys(searchWhere).forEach(function (k) { q[k] = searchWhere[k]; });
        q.field = sortParam.field;
        q.order = sortParam.order;
        return q;
    }

    var planetTable = table.render({
        elem: '#planetTable',
        url: '/planet/getList',
        method: 'get',
        toolbar: '#planetToolbar',
        defaultToolbar: ['filter', 'print', 'exports'],
        page: true,
        limit: 20,
        limits: [10, 20, 50, 100],
        autoSort: false,
        initSort: { field: 'id', type: 'desc' },
        cols: [[
            { type: 'numbers', fixed: 'left' },
            { field: 'name', title: '名称', minWidth: 120 },
            { field: 'seed', title: '种子', width: 110, align: 'center' },
            { field: 'type_text', title: '类型', width: 110, align: 'center' },
            { field: 'intro', title: '介绍', minWidth: 200, templet: function (d) {
                return '<div class="planet-intro-preview" title="' + (d.intro || '') + '">' + (d.intro || '-') + '</div>';
            } },
            { field: 'sort', title: '排序', width: 80, align: 'center', sort: true },
            { field: 'status', title: '状态', width: 90, align: 'center', templet: '#statusTpl' },
            { field: 'create_time_text', title: '创建时间', minWidth: 160 },
            { title: '操作', width: 90, toolbar: '#barTpl', fixed: 'right', align: 'center' }
        ]],
        skin: 'line',
        even: true,
        text: { none: '暂无数据' }
    });

    // 搜索
    form.on('submit(search)', function (data) {
        searchWhere = data.field || {};
        planetTable.reload({ where: mergeQuery(), page: { curr: 1 } });
        return false;
    });

    // 表头排序
    table.on('sort(planetTable)', function (obj) {
        sortParam.field = obj.field || 'id';
        sortParam.order = obj.type || 'desc';
        planetTable.reload({
            initSort: obj,
            where: mergeQuery(),
            page: { curr: 1 }
        });
    });

    // 工具栏事件（新增/刷新）
    table.on('toolbar(planetTable)', function (obj) {
        if (obj.event === 'add') openForm('add');
        if (obj.event === 'refresh') planetTable.reload();
    });

    // 操作列：单省略按钮 → 操作弹窗（编辑/启用禁用/删除）
    table.on('tool(planetTable)', function (obj) {
        var data = obj.data;
        if (obj.event !== 'ops') return;

        var btns = '';
        btns += '<button type="button" class="op-act-btn" data-ev="edit"><i class="fas fa-edit"></i> 编辑</button>';
        btns += '<button type="button" class="op-act-btn primary" data-ev="find"><i class="fas fa-heart"></i> 寻人配置</button>';
        if (data.status == 1) {
            btns += '<button type="button" class="op-act-btn warn" data-ev="disable"><i class="fas fa-ban"></i> 禁用</button>';
        } else {
            btns += '<button type="button" class="op-act-btn" data-ev="enable"><i class="fas fa-check-circle"></i> 启用</button>';
        }
        btns += '<button type="button" class="op-act-btn danger" data-ev="del"><i class="fas fa-trash"></i> 删除</button>';

        var html = '<div class="op-layer-target"><i class="fas fa-globe"></i> 操作对象：<b>' + data.name + '</b></div>' +
                   '<div class="op-layer-body">' + btns + '</div>';
        var opsLayer = layer.open({
            type: 1,
            title: '操作',
            area: ['280px', 'auto'],
            content: html,
            closeBtn: 1,
            shade: 0.3,
            shadeClose: true
        });
        $('#layui-layer' + opsLayer + ' .op-layer-body button').off('click').on('click', function () {
            var ev = $(this).attr('data-ev');
            layer.close(opsLayer);
            if (ev === 'edit') openForm('edit', data);
            else if (ev === 'find') openFindConfig(data);
            else if (ev === 'enable' || ev === 'disable') toggleStatus(data, ev === 'enable' ? 1 : 0);
            else if (ev === 'del') deleteItem(data);
        });
    });

    // 上下线切换
    function toggleStatus(data, toStatus) {
        layer.confirm('确定将星球【' + data.name + '】' + (toStatus === 1 ? '启用' : '禁用') + '吗？', { icon: 3, title: '提示' }, function (index) {
            $.post('/planet/toggle', { id: data.id, status: toStatus }, function (res) {
                if (res.code === 0) { layer.close(index); layer.msg(res.msg, { icon: 1 }); planetTable.reload(); }
                else { layer.msg(res.msg, { icon: 2 }); }
            }, 'json');
        });
    }

    // 删除
    function deleteItem(data) {
        layer.confirm('确定删除星球【' + data.name + '】吗？删除后客户端将不再展示。', { icon: 3, title: '删除确认' }, function (index) {
            $.post('/planet/delete', { id: data.id }, function (res) {
                if (res.code === 0) { layer.close(index); layer.msg(res.msg, { icon: 1 }); planetTable.reload(); }
                else { layer.msg(res.msg, { icon: 2 }); }
            }, 'json');
        });
    }

    // 生成类型下拉 option 串（选中值由 form.val 回填）
    function buildTypeOptions() {
        var keys = Object.keys(PLANET_TYPES || {});
        var out = '';
        for (var i = 0; i < keys.length; i++) {
            out += '<option value="' + keys[i] + '">' + PLANET_TYPES[keys[i]] + '</option>';
        }
        return out;
    }

    // ===== 新增 / 编辑表单（layui-form 规范写法） =====
    function openForm(type, data) {
        var isEdit = type === 'edit';
        layer.open({
            type: 1,
            title: isEdit ? '编辑星球' : '新增星球',
            area: ['480px', 'auto'],
            content: formHtml(isEdit, data),
            success: function (layero) {
                // 弹窗 DOM 就绪后渲染表单组件
                form.render();
                if (isEdit) {
                    form.val('planetForm', {
                        name: data.name || '',
                        type: data.type || 'earth',
                        intro: data.intro || '',
                        sort: data.sort != null ? data.sort : 0,
                        status: parseInt(data.status, 10) === 1 ? 'on' : undefined
                    });
                    form.render();
                }
            }
        });
    }

    function formHtml(isEdit, data) {
        return '' +
        '<form class="layui-form" id="planetForm" lay-filter="planetForm" style="padding:20px 25px 5px;">' +
            (isEdit ? '<input type="hidden" name="id" value="' + data.id + '">' : '') +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">名称</label>' +
                '<div class="layui-input-block"><input type="text" name="name" placeholder="请输入星球名称（最多50字）" lay-verify="required" maxlength="50" autocomplete="off" class="layui-input"></div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">类型</label>' +
                '<div class="layui-input-block">' +
                    '<select name="type">' + buildTypeOptions() + '</select>' +
                    '<div class="form-tip">客户端星球页将按类型生成对应材质外观</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">介绍</label>' +
                '<div class="layui-input-block"><textarea name="intro" placeholder="星球介绍（最多500字）" maxlength="500" class="layui-textarea" rows="4"></textarea></div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">排序</label>' +
                '<div class="layui-input-block"><input type="number" name="sort" value="0" placeholder="数值越小越靠前" autocomplete="off" class="layui-input"></div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">单次费用</label>' +
                '<div class="layui-input-block">' +
                    '<input type="number" name="match_cost" min="0" value="' + (isEdit ? (parseInt(data.match_cost, 10) || 0) : 0) + '" placeholder="每次匹配消耗熊爪，0=免费" autocomplete="off" class="layui-input">' +
                    '<div class="form-tip">每次发起寻找消耗的熊爪积分；0 表示免费。免费次数用尽后按此费用扣熊爪</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">免费次数</label>' +
                '<div class="layui-input-block">' +
                    '<input type="number" name="free_match_count" min="0" value="' + (isEdit ? (parseInt(data.free_match_count, 10) || 0) : 0) + '" placeholder="每个账号在该星球永久免费次数，0=无" autocomplete="off" class="layui-input">' +
                    '<div class="form-tip">每个账号在该星球可永久免费发起寻找的次数；用尽后按单次费用扣熊爪</div>' +
                '</div>' +
            '</div>' +
            (isEdit ?
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">种子</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" value="' + data.seed + '" disabled class="layui-input">' +
                    '<div class="form-tip">创建时自动生成，决定星球地形，不可修改</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">状态</label>' +
                '<div class="layui-input-block"><input type="checkbox" name="status" value="on" lay-skin="switch" lay-text="启用|禁用" checked></div>' +
            '</div>'
            : '') +
            '<div class="layui-form-item" style="text-align:right;padding-right:25px;">' +
                '<button class="layui-btn" lay-submit lay-filter="submitPlanet">确定</button>' +
                '<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>' +
            '</div>' +
        '</form>';
    }

    // ===== 寻人配置弹窗 =====
    // 所有可选字段（key=存储值，value=显示名）；性别/年龄为默认必填
    var FIND_FIELD_OPTIONS = {
        'gender':       '我的性别',
        'age':          '我的年龄',
        'income_range': '我的月收入范围',
        'personality':  '我的性格',
        'city':         '我的城市',
        'face_score':   '我的颜值打分',
        'edu_level':    '我的学历'
    };

    function buildFindFieldsHtml(selected) {
        var out = '';
        var keys = Object.keys(FIND_FIELD_OPTIONS);
        for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var checked = selected.indexOf(k) >= 0 ? ' checked' : '';
            var disabled = (k === 'gender' || k === 'age') ? ' disabled' : '';
            out += '<input type="checkbox" name="find_field" value="' + k + '" title="' + FIND_FIELD_OPTIONS[k] + '" lay-skin="primary"' + checked + disabled + '>';
        }
        return out;
    }

    function openFindConfig(data) {
        var fields = [];
        try {
            var parsed = JSON.parse(data.find_fields || '[]');
            if (Object.prototype.toString.call(parsed) === '[object Array]') fields = parsed;
        } catch (e) { fields = []; }
        if (fields.indexOf('gender') < 0) fields.push('gender');
        if (fields.indexOf('age') < 0) fields.push('age');

        layer.open({
            type: 1,
            title: '寻人配置 - ' + data.name,
            area: ['520px', 'auto'],
            content: findConfigHtml(data, fields),
            success: function (layero) {
                form.render();
                form.val('findConfigForm', {
                    enable_find: parseInt(data.enable_find, 10) === 1 ? 'on' : undefined,
                    force_face_auth: parseInt(data.force_face_auth, 10) === 1 ? 'on' : undefined,
                    force_edu_auth: parseInt(data.force_edu_auth, 10) === 1 ? 'on' : undefined,
                    force_asset_auth: parseInt(data.force_asset_auth, 10) === 1 ? 'on' : undefined,
                    match_cost: parseInt(data.match_cost, 10) || 0,
                    free_match_count: parseInt(data.free_match_count, 10) || 0
                });
                form.render();
            }
        });
    }

    function findConfigHtml(data, fields) {
        return '' +
        '<form class="layui-form" id="findConfigForm" lay-filter="findConfigForm" style="padding:20px 25px 5px;">' +
            '<input type="hidden" name="id" value="' + data.id + '">' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">开启寻人</label>' +
                '<div class="layui-input-block">' +
                    '<input type="checkbox" name="enable_find" value="on" lay-skin="switch" lay-text="开启|关闭">' +
                    '<div class="form-tip">开启后，该星球的客户端将展示「开始寻找」入口</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">需填写参数</label>' +
                '<div class="layui-input-block">' +
                    '<div style="line-height:34px;">' + buildFindFieldsHtml(fields) + '</div>' +
                    '<div class="form-tip">勾选该星球需要填写哪些资料。性别、年龄为默认必填；勾选城市后可要求「只找同城」，勾选颜值/收入/性格/学历后匹配时对应用户也需满足对应目标条件（客户端表单会自动带出对应目标项）</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item" style="border-top:1px dashed #eee;padding-top:10px;">' +
                '<label class="layui-form-label">强制认证</label>' +
                '<div class="layui-input-block" style="line-height:38px;">' +
                    '<input type="checkbox" name="force_face_auth" value="on" title="颜值认证" lay-skin="primary">' +
                    '<input type="checkbox" name="force_edu_auth" value="on" title="学历认证" lay-skin="primary">' +
                    '<input type="checkbox" name="force_asset_auth" value="on" title="资产认证" lay-skin="primary">' +
                    '<div class="form-tip">开启后，未完成对应认证的用户不能在该星球发起/被匹配（认证功能后续版本上线，当前仅预留校验）</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">单次费用</label>' +
                '<div class="layui-input-block">' +
                    '<input type="number" name="match_cost" min="0" value="' + (parseInt(data.match_cost, 10) || 0) + '" placeholder="每次匹配消耗熊爪，0=免费" autocomplete="off" class="layui-input">' +
                    '<div class="form-tip">每次发起寻找消耗的熊爪积分；0 表示免费。免费次数用尽后按此费用扣熊爪</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">免费次数</label>' +
                '<div class="layui-input-block">' +
                    '<input type="number" name="free_match_count" min="0" value="' + (parseInt(data.free_match_count, 10) || 0) + '" placeholder="每个账号在该星球永久免费次数，0=无" autocomplete="off" class="layui-input">' +
                    '<div class="form-tip">每个账号在该星球可永久免费发起寻找的次数；用尽后按单次费用扣熊爪。与创建/编辑表单共用同一字段</div>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item" style="text-align:right;padding-right:25px;">' +
                '<button class="layui-btn" lay-submit lay-filter="submitFindConfig">保存</button>' +
                '<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>' +
            '</div>' +
        '</form>';
    }

    // 保存寻人配置
    form.on('submit(submitFindConfig)', function (data) {
        var checked = [];
        $('input[name="find_field"]:checked').each(function () { checked.push($(this).val()); });
        var formData = {
            id: data.field.id,
            enable_find: data.field.enable_find === 'on' ? 1 : 0,
            find_fields: JSON.stringify(checked),
            force_face_auth: data.field.force_face_auth === 'on' ? 1 : 0,
            force_edu_auth: data.field.force_edu_auth === 'on' ? 1 : 0,
            force_asset_auth: data.field.force_asset_auth === 'on' ? 1 : 0,
            match_cost: parseInt(data.field.match_cost, 10) || 0,
            free_match_count: parseInt(data.field.free_match_count, 10) || 0
        };
        $.post('/planet/findConfig', formData, function (res) {
            if (res.code === 0) { layer.closeAll(); layer.msg(res.msg, { icon: 1 }); planetTable.reload(); }
            else { layer.msg(res.msg, { icon: 2 }); }
        }, 'json');
        return false;
    });

    // 提交（通过隐藏域 id 判断编辑/新增）
    form.on('submit(submitPlanet)', function (data) {
        var formData = {
            name: data.field.name,
            type: data.field.type || 'earth',
            intro: data.field.intro || '',
            sort: parseInt(data.field.sort, 10) || 0,
            match_cost: parseInt(data.field.match_cost, 10) || 0,
            free_match_count: parseInt(data.field.free_match_count, 10) || 0
        };
        var editId = $('input[name="id"]').val();
        var url = editId ? '/planet/edit' : '/planet/add';
        if (editId) {
            formData.id = editId;
            formData.status = data.field.status === 'on' ? 1 : 0;
        }
        $.post(url, formData, function (res) {
            if (res.code === 0) { layer.closeAll(); layer.msg(res.msg, { icon: 1 }); planetTable.reload(); }
            else { layer.msg(res.msg, { icon: 2 }); }
        }, 'json');
        return false;
    });

    // 取消
    $(document).on('click', '#btnCancel', function () { layer.closeAll(); });
});
</script>
{/block}
